name: AI DJ

on:
  push:
    paths: ["ai-dj/**", ".github/workflows/ai-dj.yml"]
  pull_request:
    paths: ["ai-dj/**", ".github/workflows/ai-dj.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-dj } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Core tests (analysis, selection, planning, Claude/MCP layer)
        run: ./gradlew :dj-core:test --console=plain
      - name: Native engine + plan integration tests
        run: native-tests/run.sh
      - name: Backend tests
        working-directory: ai-dj/backend
        run: npm ci && npm test

  apk:
    runs-on: ubuntu-latest
    needs: tests
    defaults: { run: { working-directory: ai-dj } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - name: Install NDK/CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AI-DJ-apk
          path: ai-dj/app/build/outputs/apk/release/app-release.apk
