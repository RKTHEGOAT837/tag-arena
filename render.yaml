# Render Blueprint. With this file in the repo root, Render configures the
# service itself instead of you filling in the form by hand.
services:
  - type: web
    name: tag-arena
    runtime: node
    plan: free
    # No dependencies to install - the game is Node standard library only.
    buildCommand: echo "nothing to build"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set this to your real Render URL after the first deploy so the
      # downloadable tag.html points at the right place. The main link
      # works without it.
      # - key: PUBLIC_URL
      #   value: https://tag-arena.onrender.com

  # AI DJ backend (Gemini free tier by default). Deployable entirely from a phone:
  # render.com -> New -> Blueprint -> this repo. Only GEMINI_API_KEY must be pasted in;
  # APP_TOKENS is auto-generated (copy it from the service's Environment tab into the app).
  - type: web
    name: ai-dj-backend
    runtime: node
    plan: free
    rootDir: ai-dj/backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_TOKENS
        generateValue: true
